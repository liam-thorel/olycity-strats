# Mini PC (ak1) : docker compose up -d --build
# Accès public : tunnel Cloudflare `ak1` (conteneur cloudflared du bot musique),
# route strats.olycity.fr → http://olycity-strats:3100
services:
  strats:
    build: .
    container_name: olycity-strats
    restart: unless-stopped
    env_file: .env
    volumes:
      # strats.json, sessions.json et media/ (vidéos) : c'est ce dossier qui grossit.
      - ./data:/app/data
    ports:
      - "127.0.0.1:3100:3100" # jamais exposé directement : l'accès passe par le tunnel
    networks: [default, tunnel]

  # Robot du groupe TikTok : lit le groupe avec le compte dédié et envoie les TikToks au serveur.
  # Session : data/tiktok-state.json (créée par inbox/login.mjs sur un PC). Réglages dans .env :
  # TIKTOK_GROUP (nom exact du groupe) et INGEST_TOKEN (le même que pour « strats »).
  inbox:
    build: ./inbox
    container_name: olycity-strats-inbox
    restart: unless-stopped
    env_file: .env
    environment:
      INGEST_URL: http://strats:3100/internal/ingest
      STATE_FILE: /data/tiktok-state.json
      SEEN_FILE: /data/tiktok-inbox.json
    volumes:
      - ./data:/data
    depends_on: [strats]
    mem_limit: 800m

networks:
  tunnel:
    external: true
    name: discord-music-bot_default
